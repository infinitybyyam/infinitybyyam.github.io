<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning by Yam &middot; Infinity by Yam</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E50914;
    --red-dark: #b00710;
    --black: #080808;
    --surface: #121212;
    --surface2: #1a1a1a;
    --surface3: #262626;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --faint: #6e6e73;
    color-scheme: dark;
  }

  html { scroll-behavior: smooth; scroll-padding-top: 96px; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  a { -webkit-tap-highlight-color: transparent; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 6%;
    background: rgba(8,8,8,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
  }

  .nav-logo-img { height: 64px; width: auto; flex-shrink: 0; }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  .nav-links a:hover, .nav-links a:focus-visible { color: var(--text); }

  .nav-dropdown { position: relative; }

  .nav-dropdown-toggle {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0;
    transition: color 0.2s ease;
  }

  .nav-dropdown-toggle:hover,
  .nav-dropdown-toggle:focus-visible,
  .nav-dropdown-toggle[aria-expanded="true"] { color: var(--text); }

  .nav-dropdown-caret {
    font-size: 0.6rem;
    transition: transform 0.2s ease;
  }

  .nav-dropdown-toggle[aria-expanded="true"] .nav-dropdown-caret { transform: rotate(180deg); }

  .nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 14px);
    left: 50%;
    list-style: none;
    min-width: 200px;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 0.4rem;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    z-index: 200;
  }

  .nav-dropdown-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .nav-dropdown-menu li + li { margin-top: 0.15rem; }

  .nav-dropdown-menu a {
    display: block;
    padding: 0.55rem 0.75rem;
    border-radius: 4px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-transform: none;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-dropdown-menu a:hover,
  .nav-dropdown-menu a:focus-visible {
    background: rgba(229,9,20,0.12);
    color: #fff;
  }

  /* ── MAIN CONTENT WRAPPER ── */
  .page-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 7rem 6% 6rem;
  }

  /* ── HUB HEADER / SEARCH BAR ── */
  .hub-header {
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
  }

  .hub-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    letter-spacing: 1px;
    color: #fff;
    margin-bottom: 1.25rem;
    line-height: 1;
  }

  .filter-bar {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 1rem 1.25rem;
    border-radius: 6px;
  }

  .search-input {
    flex: 1;
    min-width: 240px;
    background: var(--black);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 0.75rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-input:focus { border-color: var(--red); }
  .search-input::placeholder { color: var(--faint); }
  .search-input:disabled { cursor: not-allowed; opacity: 0.6; }

  .filter-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .f-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--black);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--muted);
    padding: 0.7rem 1rem;
    border-radius: 4px;
  }

  .f-chip.active { border-color: var(--red); color: #fff; background: rgba(229,9,20,0.12); }
  .f-chip:disabled { cursor: not-allowed; }

  /* ── COMING SOON ── */
  .coming-soon {
    text-align: center;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: clamp(3rem, 8vw, 6rem) 1.5rem;
  }

  .coming-soon-badge {
    display: inline-block;
    border: 1px solid rgba(229,9,20,0.4);
    background: rgba(229,9,20,0.1);
    color: var(--red);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 0.35rem 0.85rem;
    margin-bottom: 1.25rem;
    border-radius: 2px;
  }

  .coming-soon-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: 1px;
    color: #fff;
  }

  /* ── CONTACT SECTION ── */
  .contact-section {
    padding: 6rem 6%;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .contact-pre {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 1.25rem;
  }

  .contact-headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    line-height: 0.95;
    margin-bottom: 2rem;
    letter-spacing: 2px;
    color: #fff;
  }

  .contact-links {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    transition: all 0.2s ease;
  }

  .contact-link:hover, .contact-link:focus-visible { color: #fff; border-color: #fff; }

  /* ── FOOTER ── */
  footer {
    padding: 2.5rem 6%;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .footer-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: var(--text);
    letter-spacing: 2px;
  }

  .footer-copy {
    font-size: 0.8rem;
    color: var(--faint);
  }

  @media (max-width: 768px) {
    /* Stack logo and links vertically on mobile so they aren't cramped */
    nav {
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 5%;
    }
    
    .nav-logo-img { 
      height: 48px; /* Slightly smaller logo for mobile */
    }

    .nav-links {
      gap: 1.25rem;
    }

    .nav-links a, .nav-dropdown-toggle {
      font-size: 0.72rem;
      letter-spacing: 0.8px;
    }

    /* Reduce excessive vertical spacing on phone screens */
    .hero {
      padding: 7rem 5% 4rem; /* Cuts down the massive top/bottom gaps */
    }

    .page-wrap {
      padding: 5rem 5% 4rem;
    }

    .contact-section {
      padding: 4rem 5%;
    }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="https://infinitybyyam.github.io/" class="nav-logo">
    <img class="nav-logo-img" src="../nav-mark.png" alt="Infinity by Yam">
  </a>
  <ul class="nav-links">
    <li><a href="https://infinitybyyam.github.io/">Back to Home</a></li>
    <li class="nav-dropdown">
      <button type="button" class="nav-dropdown-toggle" id="valuation-toggle" aria-haspopup="true" aria-expanded="false">
        Important Links <span class="nav-dropdown-caret">▾</span>
      </button>
      <ul class="nav-dropdown-menu" id="valuation-menu">
        <li><a href="https://www.screener.in/" target="_blank" rel="noopener">Screener.in</a></li>
        <li><a href="https://valueinvesting.io/" target="_blank" rel="noopener">ValueInvesting.io</a></li>
        <li><a href="https://tradingeconomics.com/" target="_blank" rel="noopener">TradingEconomics.com</a></li>
      </ul>
    </li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<script>
  (function () {
    var toggle = document.getElementById('valuation-toggle');
    var menu = document.getElementById('valuation-menu');

    function closeMenu() {
      menu.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    }
    function openMenu() {
      menu.classList.add('open');
      toggle.setAttribute('aria-expanded', 'true');
    }

    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.classList.contains('open')) { closeMenu(); } else { openMenu(); }
    });
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && e.target !== toggle) { closeMenu(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeMenu(); }
    });
  })();
</script>

<div class="page-wrap">

  <!-- HUB HEADER -->
  <header class="hub-header">
    <h1 class="hub-title">Learning by Yam</h1>
    <!-- SEARCH & CHIPS BAR (disabled until topics are published) -->
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search topics or keywords..." disabled>
      <div class="filter-chips">
        <button class="f-chip active" disabled>All Topics</button>
        <button class="f-chip" disabled>Strategic Finance</button>
        <button class="f-chip" disabled>Valuation</button>
      </div>
    </div>
  </header>

  <!-- COMING SOON -->
  <section class="coming-soon">
    <div class="coming-soon-badge">In Progress</div>
    <h2 class="coming-soon-title">Topics Coming Soon</h2>
  </section>

</div>

<!-- CONTACT -->
<section class="contact-section" id="contact">
  <p class="contact-pre">Contact</p>
  <h2 class="contact-headline">Get in touch</h2>
  <div class="contact-links">
    <a href="mailto:infinitybyyam@gmail.com" class="contact-link">↗ Email</a>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">INFINITY BY YAM</div>
  <div class="footer-copy">&copy; 2026 Infinity by Yam. All rights reserved.</div>
</footer>

</body>
</html>
