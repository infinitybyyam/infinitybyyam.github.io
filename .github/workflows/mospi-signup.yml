name: MoSPI sign-up (run once)

# Run this once, by hand, after saving the repository secrets MOSPI_EMAIL and MOSPI_PASSWORD.
# It creates the free MoSPI API account, checks the login works, and asks MoSPI for one month
# as a test. It saves nothing to the site. Delete this file after it has worked.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - name: Create the MoSPI account and test it
        env:
          MOSPI_EMAIL: ${{ secrets.MOSPI_EMAIL }}
          MOSPI_PASSWORD: ${{ secrets.MOSPI_PASSWORD }}
        run: |
          python3 - <<'PY'
          """One-time helper: create the MoSPI API account from the two repository secrets,
          then test the login and ask for one specific month. Saves nothing to the site.
          Never prints the email or password (GitHub also hides them in logs)."""
          import json, os, ssl, sys, urllib.error, urllib.parse, urllib.request

          API = "https://api.mospi.gov.in"
          UA = "InfinityByYam-InflationCalculator/1.0 (+https://infinitybyyam.github.io/Calculators/personal_inflation_calculator.html)"
          EMAIL = os.environ.get("MOSPI_EMAIL", "").strip()
          PASSWORD = os.environ.get("MOSPI_PASSWORD", "").strip()


          def ctx(verify):
              c = ssl.create_default_context()
              c.options |= getattr(ssl, "OP_LEGACY_SERVER_CONNECT", 0x4)
              if not verify:
                  c.check_hostname = False
                  c.verify_mode = ssl.CERT_NONE
              return c


          CTX = [ctx(True)]


          def call(method, path, params=None, body=None, form=False, headers=None):
              url = API + path + ("?" + urllib.parse.urlencode(params) if params else "")
              h = {"User-Agent": UA, "Accept": "application/json"}
              data = None
              if body is not None:
                  if form:
                      data = urllib.parse.urlencode(body).encode()
                      h["Content-Type"] = "application/x-www-form-urlencoded"
                  else:
                      data = json.dumps(body).encode()
                      h["Content-Type"] = "application/json"
              h.update(headers or {})
              for _ in range(2):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h, method=method),
                                                  timeout=60, context=CTX[0]) as r:
                          return r.status, json.loads(r.read().decode("utf-8") or "{}")
                  except urllib.error.HTTPError as e:
                      try:
                          return e.code, json.loads(e.read().decode("utf-8") or "{}")
                      except ValueError:
                          return e.code, {}
                  except urllib.error.URLError as e:
                      if isinstance(e.reason, ssl.SSLCertVerificationError):
                          print("Note: MoSPI's certificate could not be verified; retrying without verification.")
                          CTX[0] = ctx(False)
                          continue
                      raise
              return 0, {}


          def said(resp):
              """MoSPI's own status message, without echoing anything personal."""
              if not isinstance(resp, dict):
                  return ""
              for k in ("msg", "message", "Message", "error"):
                  if isinstance(resp.get(k), str):
                      return resp[k].replace(EMAIL, "***") if EMAIL else resp[k]
              return ""


          def token_of(resp):
              if not isinstance(resp, dict):
                  return None
              for holder in (resp, resp.get("data") if isinstance(resp.get("data"), dict) else {}):
                  for k in ("Token", "token", "access_token", "accessToken"):
                      if isinstance(holder.get(k), str) and holder[k].strip():
                          return holder[k].strip()
              return None


          def main():
              if not EMAIL or not PASSWORD:
                  print("STOP: add the repository secrets MOSPI_EMAIL and MOSPI_PASSWORD first.")
                  return 1

              # 1. Sign up (if the account already exists, MoSPI says so and we carry on).
              body = {"username": "infinitybyyam", "email": EMAIL, "password": PASSWORD,
                      "organization": "InfinitybyYam", "purpose": "Personal inflation calculator on a public website"}
              code, resp = call("POST", "/api/users/usersignup", body=body)
              if code >= 400 and code != 409:
                  code2, resp2 = call("POST", "/api/users/usersignup", body=body, form=True)
                  if code2 < 400:
                      code, resp = code2, resp2
              print(f"1. Sign-up: HTTP {code}. MoSPI says: {said(resp) or '(no message)'}")

              # 2. Log in.
              code, resp = call("POST", "/api/login", body={"email": EMAIL, "password": PASSWORD})
              tok = token_of(resp)
              print(f"2. Login: HTTP {code}. MoSPI says: {said(resp) or '(no message)'}. Token received: {'yes' if tok else 'no'}")
              if not tok:
                  print("RESULT: login did not work yet. If MoSPI sent you an email to confirm the account, confirm it and run this again.")
                  return 1

              # 3. Ask for one specific month, to see whether choosing a month works with the login.
              params = {"base_year": "2024", "series": "Current", "year": "2026", "month_code": "9", "state_code": "1",
                        "sector_code": "3", "division_code": "0", "limit": "10", "Format": "JSON"}
              for scheme in ("Bearer ", ""):
                  code, resp = call("GET", "/api/cpi/getCPIData", params=params, headers={"Authorization": scheme + tok})
                  if code < 400:
                      break
              rows = resp.get("data") if isinstance(resp, dict) else None
              rows = rows if isinstance(rows, list) else []
              months = sorted({f"{r.get('month')} {r.get('year')}" for r in rows if isinstance(r, dict)})
              print(f"3. Asked for September 2026: HTTP {code}, {len(rows)} rows, months in the answer: {', '.join(months) or 'none'}")
              print(f"   meta: {resp.get('meta_data') if isinstance(resp, dict) else None}")
              if "September 2026" in months:
                  print("RESULT: everything works. The login lets the daily update ask for a specific month.")
                  return 0
              print("RESULT: login works, but MoSPI did not return September 2026 for that request. Send me this log.")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
