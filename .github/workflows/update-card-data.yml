name: Update card data

# Downloads the latest CardAdvisor card file once a day and saves it as
# Products/cards.json. If nothing changed, nothing is committed.
# If the download fails or looks wrong, the old file is kept.

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 01:17 UTC (06:47 India time)
  workflow_dispatch:        # adds a "Run workflow" button to run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Download the latest card data
        run: |
          curl -fsSL --retry 3 --max-time 60 \
            -A "InfinityByYam-CardFinder/1.0 (+https://infinitybyyam.github.io/Products/credit_card_finder.html)" \
            -o /tmp/cards.json https://cardadvisor.in/data/cards.json

      - name: Check the file looks right
        run: |
          jq -e '.asOf and (.cards | type == "array") and (.cards | length >= 150)' /tmp/cards.json
          jq -e '[.cards[] | select(.rewards | type == "array")] | length >= 150' /tmp/cards.json
          echo "Cards: $(jq '.cards | length' /tmp/cards.json), as of $(jq -r '.asOf' /tmp/cards.json)"
          cp /tmp/cards.json Products/cards.json

      - name: Save it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Products/cards.json
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "Update card data from CardAdvisor"
            git push
          fi
